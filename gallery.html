<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinebarrow prop gallery</title>
    <style>
      body { background: #2a2530; }
      #gallery { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
      .gallery-ui {
        position: absolute; top: 12px; left: 12px; z-index: 5; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        padding: 8px 10px; color: var(--cream); font-size: 0.7rem;
      }
      .gallery-ui select, .gallery-ui button { padding: 4px 8px; border: 1px solid var(--line); background: #1c1420; color: #ffe0a0; font: inherit; cursor: pointer; }
      .gallery-ui label { display: flex; gap: 6px; align-items: center; }
      .gallery-help { position: absolute; bottom: 12px; left: 12px; z-index: 5; padding: 6px 10px; color: #c5a188; font-size: 0.62rem; }
      .gallery-meta {
        position: absolute; top: 12px; right: 12px; z-index: 5; width: min(320px, calc(100vw - 24px));
        padding: 10px 12px; color: #ead8ba; font: 0.68rem/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
        white-space: pre-line; pointer-events: none;
      }
    </style>
    <script type="module" crossorigin src="/pines-site/assets/gallery-BHvqUOMQ.js"></script>
    <link rel="modulepreload" crossorigin href="/pines-site/assets/three-BYYO6Z1I.js">
    <link rel="modulepreload" crossorigin href="/pines-site/assets/BufferGeometryUtils-PD7vD99D.js">
    <link rel="modulepreload" crossorigin href="/pines-site/assets/scatter-Ctg6POva.js">
    <link rel="modulepreload" crossorigin href="/pines-site/assets/loaders-C-FInDx5.js">
    <link rel="modulepreload" crossorigin href="/pines-site/assets/authored-assets-BEgJ90NV.js">
    <link rel="stylesheet" crossorigin href="/pines-site/assets/scatter-BGVa5Ei_.css">
  </head>
  <body>
    <canvas id="gallery"></canvas>
    <div class="gallery-ui glass-panel">
      <strong>Prop gallery</strong>
      <label>Item <select id="gallery-select"></select></label>
      <button type="button" id="gallery-prev">◀</button>
      <button type="button" id="gallery-next">▶</button>
      <label>Clip <select id="gallery-clip"></select></label>
      <label>LOD <select id="gallery-lod"><option value="auto">Auto</option><option value="0">LOD0</option><option value="1">LOD1</option></select></label>
      <button type="button" id="gallery-all">All</button>
      <label><input type="checkbox" id="gallery-spin" checked /> Turntable</label>
      <label><input type="checkbox" id="gallery-wire" /> Wireframe</label>
      <label><input type="checkbox" id="gallery-bounds" /> Bounds</label>
    </div>
    <aside id="gallery-meta" class="gallery-meta glass-panel">Select an authored asset to inspect its contract.</aside>
    <p class="gallery-help glass-panel">Drag to orbit · wheel to zoom · ← → cycle items · URL ?item=name, ?sheet=N or ?lod=0|1</p>
  </body>
</html>
